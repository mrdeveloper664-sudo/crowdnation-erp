# Dev container: the app container plus a throw-away PostgreSQL 16 (dev-only passwords, not reachable from outside).
services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:22
    volumes: ["..:/workspaces/${localWorkspaceFolderBasename}:cached"]
    command: sleep infinity
    depends_on: [db]
  db:
    image: postgres:16
    restart: unless-stopped
    environment: { POSTGRES_PASSWORD: postgres }
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
